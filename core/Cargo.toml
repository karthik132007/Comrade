[package]
name = "comrade-core"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["connect"] }
base64 = "0.22"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
# Local voice pipeline: sherpa-onnx runtime (STT/VAD/TTS), mic capture,
# resampling, checksums, model archive extraction.
sherpa-rs = "0.6"
sherpa-rs-sys = "0.6"
cpal = "0.16"
hound = "3"
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
